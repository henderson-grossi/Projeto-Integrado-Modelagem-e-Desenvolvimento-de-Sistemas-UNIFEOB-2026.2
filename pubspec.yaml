name: rvlabel_app
description: App da RV Label (colecao Essence) - Projeto Integrado UNIFEOB 2026.2
publish_to: none
version: 1.3.1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  firebase_core: ^4.9.0
  firebase_ai: ^3.12.1
  genui: ^0.9.0
  json_schema_builder: ^0.1.3
  firebase_app_check: ^0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# Ícone do app: o letreiro RV·LABEL. Gera os ícones de todas as plataformas com
#   dart run flutter_launcher_icons
# Fontes em assets/icon/ (1024 px; a de primeiro plano tem o letreiro menor, para o
# recorte circular do Android).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#841621"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#841621"
    theme_color: "#841621"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  shaders:
    - shaders/liquido.frag
  assets:
    - assets/fotos/
    - assets/catalogo.json
  # DM Serif Display (licença OFL em assets/fonts/OFL.txt): títulos e nomes de peça.
  fonts:
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
        - asset: assets/fonts/DMSerifDisplay-Italic.ttf
          style: italic
    # Manrope (licença OFL em assets/fonts/OFL-Manrope.txt): corpo do texto. Pesos estáticos
    # gerados da fonte variável do google/fonts.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
